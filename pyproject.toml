[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "montage-video"
version = "0.1.0"
description = "Outils en ligne de commande pour accélérer le montage vidéo (basés sur FFmpeg)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4"]
test = ["pytest>=7", "imageio-ffmpeg>=0.4"]

[project.scripts]
montage = "montage.cli:main"

[tool.setuptools]
packages = ["montage"]
